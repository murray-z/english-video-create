name: Build Windows Installer

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

env:
  APP_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '1.0.0' }}

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: 打包 exe
        run: pyinstaller --noconfirm --clean build.spec

      - name: 准备随包文件（系列素材 / 配置 / ffmpeg）
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $dest = "dist\EnglishVideo"
          New-Item -ItemType Directory -Force -Path "$dest\series", "$dest\ffmpeg" | Out-Null

          # 只带系列配置和角色参考图，不带历史成片
          Get-ChildItem series -Directory | ForEach-Object {
            $s = $_.Name
            New-Item -ItemType Directory -Force -Path "$dest\series\$s\episodes" | Out-Null
            Copy-Item "series\$s\series.json" "$dest\series\$s\series.json" -Force
            if (Test-Path "series\$s\assets") {
              Copy-Item "series\$s\assets" "$dest\series\$s\assets" -Recurse -Force
            }
          }

          # 安装包不预置 Key，首次使用时由使用者自己填写
          $cfg = @{ api_key = ""; series_id = "02_restaurant"; tts_speed = 0.75 } | ConvertTo-Json
          [System.IO.File]::WriteAllText("$PWD\$dest\config.json", $cfg, (New-Object System.Text.UTF8Encoding($false)))

          # ffmpeg 用 BtbN GPL 构建，确保带 libass（字幕烧录）和 libx264
          $zip = "$env:RUNNER_TEMP\ffmpeg.zip"
          Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath "$env:RUNNER_TEMP\ffmpeg" -Force
          Copy-Item (Get-ChildItem "$env:RUNNER_TEMP\ffmpeg" -Recurse -Filter ffmpeg.exe | Select-Object -First 1).FullName "$dest\ffmpeg\ffmpeg.exe"
          Copy-Item (Get-ChildItem "$env:RUNNER_TEMP\ffmpeg" -Recurse -Filter ffprobe.exe | Select-Object -First 1).FullName "$dest\ffmpeg\ffprobe.exe"

          $filters = & "$dest\ffmpeg\ffmpeg.exe" -hide_banner -filters 2>&1 | Out-String
          if ($filters -notmatch "subtitles") { throw "ffmpeg 缺少 subtitles 滤镜，字幕无法烧录" }
          $encoders = & "$dest\ffmpeg\ffmpeg.exe" -hide_banner -encoders 2>&1 | Out-String
          if ($encoders -notmatch "libx264") { throw "ffmpeg 缺少 libx264 编码器" }

      - name: 冒烟测试（确认打包后能加载 Gradio）
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          & "dist\EnglishVideo\EnglishVideo.exe" --self-check
          if ($LASTEXITCODE -ne 0) { throw "exe 启动自检失败" }

      - name: 安装 Inno Setup
        run: choco install innosetup -y --no-progress

      - name: 生成安装包
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $ver = $env:APP_VERSION.TrimStart("v")
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=$ver" installer.iss
          if ($LASTEXITCODE -ne 0) { throw "安装包构建失败" }

      - name: 打包免安装版（备用）
        shell: pwsh
        run: Compress-Archive -Path "dist\EnglishVideo\*" -DestinationPath "dist\EnglishVideo-portable.zip" -Force

      - uses: actions/upload-artifact@v5
        with:
          name: EnglishVideo-Windows
          path: |
            dist/installer/*.exe
            dist/EnglishVideo-portable.zip
          retention-days: 30
